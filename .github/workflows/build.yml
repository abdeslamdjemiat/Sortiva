name: Build Burger Rush APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Burger Rush project
        run: |
          unzip -o Burger_Rush_Project_v2.zip

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd Burger_Ready_Android_Project_Final
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Burger-Rush-APK
          path: Burger_Ready_Android_Project_Final/app/build/outputs/apk/debug/app-debug.apk          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE"

      - name: Build APK
        run: |
          gradle -p sortiva_apk_project :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sortiva-APK
          path: sortiva_apk_project/app/build/outputs/apk/debug/app-debug.apk
